# Piaskownica agenta: miejsce, w którym model uruchamia kod, zanim otworzy pull request.
#
# Do tej pory jedyną drogą do odpowiedzi „czy to działa" było opublikowanie zmiany i
# poczekanie na CI. Ten przebieg robi to samo bez PR-a: odbija się od gałęzi roboczej
# `simplychat-sandbox/*`, którą widzi tylko agent, i zwraca wynik do rozmowy.
#
# Polecenie przychodzi jako `choice`, nie jako dowolny napis, i nigdzie nie trafia do `run:`.
# To jest cała ochrona przed wstrzyknięciem: model wybiera jedną z czterech pozycji, a co
# się pod nią kryje, jest zapisane tutaj — w pliku, którego agent nie może zmienić
# (`assertSafeChange` w server/github/provider.ts blokuje zapis do .github/workflows/).
#
# Czas przebiegu jest tu funkcją produktu, nie wygody: pętla agentowa czeka na wynik, więc
# każda minuta przebiegu to minuta, przez którą zadanie stoi. Stąd cache `node_modules` i
# anulowanie przebiegu, który i tak nikogo już nie obchodzi.
name: Agent sandbox

on:
  workflow_dispatch:
    inputs:
      command:
        description: Co uruchomić na przygotowanych zmianach
        type: choice
        required: true
        options:
          - check
          - test
          - build
          - all

# Bez sekretów i bez zapisu. Przebieg czyta kod i uruchamia testy — nic poza tym nie jest
# mu potrzebne, a każde dodatkowe uprawnienie tutaj jest uprawnieniem agenta.
permissions:
  contents: read

# Model poprawia pliki na tej samej gałęzi roboczej i zleca przebieg ponownie. Wynik
# poprzedniego jest wtedy odpowiedzią na kod, którego już nie ma — a mimo to zajmuje
# maszynę i minuty konta.
concurrency:
  group: agent-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    # Pętla agentowa czeka na ten wynik, więc przebieg, który się zawiesił, jest gorszy niż
    # przebieg, który padł: model dostaje „trwa" w kółko, aż wyczerpie rundy.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      # `cache: npm` wyżej odkłada pobrane paczki, ale `npm ci` i tak kasuje node_modules i
      # rozpakowuje wszystko od nowa — a to jest w tym przebiegu najdłuższy krok. Klucz to
      # zawartość lockfile'a, więc odtworzony katalog zawsze odpowiada zależnościom z
      # gałęzi; przy zmianie lockfile'a cache po prostu nie trafia i instalacja idzie
      # normalnie.
      - name: cache node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: sandbox-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: npm ci
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: check
        if: inputs.command == 'check' || inputs.command == 'all'
        run: npm run check

      - name: test
        if: inputs.command == 'test' || inputs.command == 'all'
        run: npm test

      - name: build
        if: inputs.command == 'build'
        run: npm run build
